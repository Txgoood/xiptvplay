name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build Web Project
        run: |
          npm install || true
          npm run build || true

      - name: Create Native Android Project
        run: |
          npm install -g cordova
          cordova create myApp com.xiptv.app "X IPTV"
          cd myApp
          cordova platform add android
          rm -rf www/*
          cp -r ../dist/* www/ 2>/dev/null || cp -r ../* www/ 2>/dev/null || true

      - name: Build APK
        run: |
          cd myApp
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: myApp/**/*.apk
