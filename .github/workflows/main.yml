name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - fix-download-cancel-season-queue
    paths:
      - '.github/workflows/main.yml'
      - 'scripts/android-emulator-smoke.sh'
      - 'android/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Verify production build
        run: |
          test -s dist/index.html
          if grep -Eq 'src=["\x27]\.\.?/src/main\.tsx|src=["\x27]/src/main\.tsx' dist/index.html; then
            echo "ERROR: dist/index.html still points to uncompiled TSX source."
            exit 1
          fi
          test -d dist/assets
          find dist/assets -maxdepth 1 -type f | grep -q .

      - name: Sync Capacitor Android project
        run: npx cap sync android

      # The signing key is required; never silently generate a new identity.
      # Keep its base64 in GitHub Actions repository Secrets, not source control.
      - name: Restore and verify stable debug signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Missing ANDROID_DEBUG_KEYSTORE_BASE64 repository secret. Stable Google OAuth APK signing is mandatory."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey > /tmp/debug-signature.txt
          grep -Fq '7C:0C:EA:F5:56:EA:01:51:64:D6:66:D0:75:3B:00:6B:2E:4C:82:B5' /tmp/debug-signature.txt || {
            echo "::error::APK signing certificate is not the approved XIPTV Play stable key."
            exit 1
          }
          echo "Stable XIPTV Play debug signing certificate verified."

      - name: Build Capacitor APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify APK integrity and package metadata
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          unzip -t "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apk-certificate.txt
          grep -Fq '7c0ceaf556ea015164d666d0753b006b2e4c82b5' /tmp/apk-certificate.txt || {
            echo "::error::APK was signed with a different SHA-1 certificate."
            exit 1
          }
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "package: name='com.xiptvplay.app'" /tmp/apk-badging.txt
          grep -q "sdkVersion:'24'" /tmp/apk-badging.txt
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  emulator-smoke-test:
    name: Android emulator smoke test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout test scripts
        uses: actions/checkout@v4

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download APK produced by build job
        uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: emulator-apk

      - name: Boot emulator and run automated phone checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/android-emulator-smoke.sh

      - name: Upload emulator screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-test-report
          path: emulator-test-results/
          if-no-files-found: warn
          retention-days: 14
