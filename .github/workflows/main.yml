name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build Web Asset & Prepare Capacitor
        run: |
          npm install || true
          npm run build || true
          mkdir -p www
          cp -r dist/* www/ 2>/dev/null || true
          cp index.html www/ 2>/dev/null || true
          cp -r src www/ 2>/dev/null || true
          npx @capacitor/cli init "X IPTV" "com.xiptv.app" --web-dir www --web-dir dist || true
          npx @capacitor/cli add android || true
          npx @capacitor/cli copy android || true

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
