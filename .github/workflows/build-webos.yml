name: Build LG webOS IPK
on:
  workflow_dispatch:
  push:
    branches: [feature/lg-webos-tv]
    paths:
      - 'webos/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-webos.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare webOS 2 HTML (without unsupported modern React bundle)
        run: |
          mkdir -p dist
          cp webos/legacy-index.html dist/index.html
      - name: Prepare webOS application
        run: WEBOS_LEGACY=true node webos/build.mjs
      - name: Generate offline H.264 Baseline + AAC-LC test clip
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -nostdin -hide_banner -loglevel error -y \\
            -f lavfi -i testsrc2=size=640x360:rate=25 \\
            -f lavfi -i sine=frequency=440:sample_rate=48000 \\
            -t 5 -c:v libx264 -profile:v baseline -level:v 3.0 -pix_fmt yuv420p \\
            -b:v 900k -maxrate 900k -bufsize 1800k \\
            -c:a aac -profile:a aac_low -b:a 96k -ar 48000 -ac 2 \\
            -movflags +faststart -shortest webos-package/sample.mp4
          ffprobe -v error -show_entries stream=codec_name,profile,width,height -of default=noprint_wrappers=1 webos-package/sample.mp4 | tee /tmp/webos-video-codecs.txt
          grep -q 'codec_name=h264' /tmp/webos-video-codecs.txt
          grep -q 'codec_name=aac' /tmp/webos-video-codecs.txt
          grep -q 'profile=Constrained Baseline' /tmp/webos-video-codecs.txt
          test -s webos-package/sample.mp4
      - name: Static TV package checks
        run: |
          test -s webos-package/index.html
          test -s webos-package/appinfo.json
          test -s webos-package/icon.png
          test -s webos-package/tv-remote.js
          grep -q "Yerel Video" webos-package/index.html
          grep -q "sample.mp4" webos-package/index.html
          if grep -q 'type="module"' webos-package/index.html; then echo "Legacy entry must not have ES modules"; exit 1; fi
          node -e "const f=require('./webos-package/appinfo.json'); if(f.type!=='web'||f.main!=='index.html'||f.id!=='com.xiptvplay.tv'||f.version!=='0.2.6') process.exit(1)"
      - name: Install official webOS CLI
        run: npm install -g @webos-tools/cli
      - name: Package IPK
        run: |
          mkdir -p webos-artifacts
          ares-package --no-minify ./webos-package -o ./webos-artifacts
          test -n "$(find webos-artifacts -name '*.ipk' -type f -size +0c -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: xiptvplay-lg-webos-ipk
          path: webos-artifacts/*.ipk
          if-no-files-found: error
