name: Build Fold7 TV Simulator APK
on:
  workflow_dispatch:
  push:
    branches:
      - feature/fold7-webos-simulator
    paths:
      - 'simulator/**'
      - 'webos/**'
      - '.github/workflows/build-fold7-simulator.yml'
      - 'capacitor.config.ts'
      - 'android/**'
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Android tooling
        run: npm ci
      - name: Package standalone TV simulation
        run: |
          mkdir -p dist/tv
          cp simulator/index.html dist/index.html
          cp simulator/simulator.css simulator/simulator.js dist/
          cp webos/legacy-index.html dist/tv/index.html
          cp webos/tv-layout.css webos/tv-features.js webos/tv-iptv.js webos/tv-home.js webos/tv-profiles.js webos/tv-keyboard.js dist/tv/
          test -s dist/index.html
          test -s dist/tv/index.html
          node --check dist/tv/tv-iptv.js
          node --check dist/tv/tv-home.js
          node --check dist/tv/tv-features.js
          node --check dist/simulator.js
      - name: Sync Android app assets
        run: npx cap sync android
      - name: Exclude unrelated download service from this isolated simulator
        run: |
          rm -f android/app/src/main/java/com/xiptvplay/app/DownloadForegroundService.java
          rm -f android/app/src/main/java/com/xiptvplay/app/NativeDownloadPlugin.java
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          start=s.find('<service')
          assert start>=0, 'Download service entry is missing'
          end=s.find('/>', start)
          assert end>=0, 'Invalid download service XML'
          s=s[:start]+s[end+2:]
          p.write_text(s)
          main=Path('android/app/src/main/java/com/xiptvplay/app/MainActivity.java')
          m=main.read_text()
          m=m.replace('        registerPlugin(NativeDownloadPlugin.class);', '')
          main.write_text(m)
          PY

      - name: Build simulator debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon
      - name: Verify separate app package
        run: |
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' -type f | head -n1)"
          test -s "$APK"
          unzip -t "$APK" > /dev/null
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          "$BT/apksigner" verify "$APK"
          "$BT/aapt" dump badging "$APK" | tee /tmp/simulator-badging.txt
          grep -q "package: name='com.xiptvplay.tvtester'" /tmp/simulator-badging.txt
          sha256sum "$APK"
      - name: Upload Fold7 simulator APK
        uses: actions/upload-artifact@v4
        with:
          name: xiptv-fold7-tv-simulator-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
