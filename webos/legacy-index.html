<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>XIPTV Play TV</title>
<style>html,body{margin:0;background:#111820;color:#effaff;font-family:Arial,sans-serif}main{padding:5%;}h1{color:#00dfef;font-size:42px}p{font-size:24px;line-height:1.5}button,input{font-size:25px;padding:16px;margin:12px 8px 12px 0;background:#1b2935;color:white;border:2px solid #4d7485}button:focus,input:focus,.selected{outline:5px solid #00f0ff;background:#285568}#video{width:80%;max-height:52vh;background:black}#status{color:#ffe092}small{font-size:18px;color:#bcd}</style></head><body>
<main><h1>XIPTV Play — LG webOS 2</h1><p>Eski televizyonlar için uyumluluk testi (v0.2.4)</p>
<p id="status">Açılış başarılı: JavaScript kontrol ediliyor...</p>
<button id="check">Sistem Kontrolü</button><button id="play">Video Testi</button><button id="stop">Durdur</button><button id="network">Bağlantı Testi</button>
<p><small>Bu tanılama sürümü henüz playlist ve profil içermez. Video Testi halka açık örnek MP4 kullanır. İnternet gereklidir.</small></p>
<video id="video" controls playsinline></video><p id="detail"></p></main>
<script>
(function(){
var buttons=[document.getElementById('check'),document.getElementById('play'),document.getElementById('stop'),document.getElementById('network')];
var video=document.getElementById('video'),status=document.getElementById('status'),detail=document.getElementById('detail'),selected=0,events=0,lastAction='Yok',lastKey='Yok';
function report(){detail.innerHTML='Olay: '+events+' | Son tuş: '+lastKey+' | Son işlem: '+lastAction;}
function focusButton(n){selected=(n+buttons.length)%buttons.length;for(var i=0;i<buttons.length;i++)buttons[i].className=(i===selected?'selected':'');try{if(document.activeElement!==buttons[selected])buttons[selected].focus();}catch(x){}}
function networkCheck(){var urls=['https://xiptvplay.onrender.com/api/health','https://storage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4'];var pos=0;function next(){if(pos>=urls.length)return;var url=urls[pos++],xhr=new XMLHttpRequest();status.innerHTML='Bağlantı kontrolü '+pos+'/'+urls.length;try{xhr.open('GET',url,true);xhr.timeout=12000;if(pos===2)xhr.setRequestHeader('Range','bytes=0-1023');xhr.onreadystatechange=function(){if(xhr.readyState===4){status.innerHTML='Bağlantı '+pos+': HTTP '+xhr.status+' | '+(xhr.getResponseHeader('Content-Type')||'tip bilinmiyor');next();}};xhr.onerror=function(){status.innerHTML='Bağlantı hatası: '+pos;next();};xhr.ontimeout=function(){status.innerHTML='Bağlantı zaman aşımı: '+pos;next();};xhr.send(null);}catch(e){status.innerHTML='Bağlantı test hatası: '+e.message;next();}}next();}
function execute(n,source){events++;lastAction=buttons[n].innerHTML+' ('+source+')';focusButton(n);
if(n===0){status.innerHTML='Sistem kontrolü çalıştı! | XHR: '+(window.XMLHttpRequest?'EVET':'HAYIR')+' | MP4: '+(video.canPlayType('video/mp4')||'belirsiz');}
if(n===1){status.innerHTML='Video testi başlatıldı (HTTPS MP4)';video.src='https://storage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4';try{video.load();video.play();}catch(ex){status.innerHTML='Video oynatma hatası: '+ex.message;}}
if(n===2){try{video.pause();video.removeAttribute('src');video.load();}catch(ex){}status.innerHTML='Video durduruldu';}if(n===3){networkCheck();}report();}
for(var i=0;i<buttons.length;i++){(function(n){buttons[n].onclick=function(){execute(n,'tıklama');};buttons[n].onfocus=function(){selected=n;for(var j=0;j<buttons.length;j++)buttons[j].className=(j===n?'selected':'');};})(i);}
document.addEventListener('keydown',function(e){var k=e.keyCode||e.which;lastKey=String(k);events++;if(k===37||k===38||k===39||k===40){focusButton(selected+((k===37||k===38)?-1:1));if(e.preventDefault)e.preventDefault();}
else if(k===13||k===16777220){execute(selected,'OK keydown');if(e.preventDefault)e.preventDefault();}
else if(k===461||k===27){status.innerHTML='Geri tuşu algılandı';}report();},false);
video.onerror=function(){status.innerHTML='Video hata kodu: '+(video.error?video.error.code:'bilinmiyor')+' | Ağ durumu: '+video.networkState+' | Kaynak: '+video.currentSrc;};video.onplaying=function(){status.innerHTML='Video oynuyor! Görüntü ve sesi kontrol et.';};video.onwaiting=function(){status.innerHTML='Video tamponlanıyor...';};
focusButton(0);status.innerHTML='XIPTV Play TV 0.2.4 açıldı. OK veya işaretçi ile Sistem Kontrolü seç.';report();
})();
</script></body></html>
